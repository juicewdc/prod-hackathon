{% extends "base.html" %}

{% block title %}Новый пост — Passepartout{% endblock %}

{% block content %}
<div class="form-wrap wide">
    <div class="page-head">
        <div>
            <h1 style="font-size:1.6rem;margin:0">Новый пост</h1>
            <p class="subtitle">Поделитесь своей историей</p>
        </div>
        <a class="btn btn-ghost" href="{% url 'travelblog:blog' %}">← Назад</a>
    </div>

    <div class="card">
        <form action="{% url 'travelblog:process_add_post' %}" method="post" class="form-grid">
            {% csrf_token %}
            <div class="field">
                <label for="title">Тема поста</label>
                <input class="input" type="text" id="title" name="title" required>
            </div>
            <div class="field">
                <label for="post_text">Текст</label>
                <textarea class="textarea" id="post_text" name="post_text" required></textarea>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Опубликовать</button>
        </form>
    </div>
</div>
{% endblock %}
