{% extends "base.html" %}

{% block title %}Вход — Passepartout{% endblock %}

{% block content %}
<div class="form-wrap">
    <div class="card">
        <div class="page-head" style="margin-bottom:1rem">
            <div>
                <h1 style="font-size:1.6rem;margin:0">С возвращением</h1>
                <p class="subtitle">Войдите в свой аккаунт</p>
            </div>
        </div>

        {% if error %}
            <div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>
        {% endif %}

        <form action="{% url 'firstapp:authentication_process' %}" method="post" class="form-grid">
            {% csrf_token %}
            <div class="field">
                <label for="email-input">Email</label>
                <input class="input" type="email" name="email" id="email-input" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password-input">Пароль</label>
                <input class="input" type="password" name="password" id="password-input" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Войти</button>
        </form>

        <p class="subtitle" style="text-align:center;margin:1rem 0 0">
            Нет аккаунта? <a href="{% url 'firstapp:register' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
