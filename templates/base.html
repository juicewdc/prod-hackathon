{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <title>{% block title %}Passepartout{% endblock %}</title>
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" href="{% if user.is_authenticated %}{% url 'mainapp:main' %}{% else %}{% url 'firstapp:firstpage' %}{% endif %}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12.5l19-8-6 17-4-6.5-9-2.5z"/>
            </svg>
            <span>Passepartout</span>
        </a>
        <nav>
            <ul class="nav">
                {% if user.is_authenticated %}
                    <li><a href="{% url 'mainapp:main' %}">Мои поездки</a></li>
                    <li><a href="{% url 'mainapp:statistics' %}">Статистика</a></li>
                    <li><a href="{% url 'travelblog:blog' %}">Блог</a></li>
                    <li><a href="{% url 'mainapp:profile' %}">Профиль</a></li>
                    <li><a href="{% url 'firstapp:logout' %}">Выйти</a></li>
                {% else %}
                    <li><a href="{% url 'firstapp:authenticate' %}">Войти</a></li>
                    <li><a href="{% url 'firstapp:register' %}">Регистрация</a></li>
                {% endif %}
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="site-footer">
    <div class="container">© Passepartout {% now "Y" %}</div>
</footer>
</body>
</html>
