{% extends "base.html" %}

{% block title %}Новая поездка — Passepartout{% endblock %}

{% block content %}
<div class="form-wrap wide">
    <div class="page-head">
        <div>
            <h1 style="font-size:1.6rem;margin:0">Новая поездка</h1>
            <p class="subtitle">Заполните данные и загрузите билет</p>
        </div>
        <a class="btn btn-ghost" href="{% url 'mainapp:main' %}">← Назад</a>
    </div>

    <div class="card">
        {% if error %}
            <div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>
        {% endif %}

        <form action="{% url 'mainapp:process_add_trip' %}" method="post" enctype="multipart/form-data" class="form-grid">
            {% csrf_token %}
            <div class="field">
                <label for="country">Страна</label>
                <input class="input" name="country" type="text" id="country" required>
            </div>
            <div class="field">
                <label for="date_start">Дата начала</label>
                <input class="input" type="date" id="date_start" name="date_start" required>
            </div>
            <div class="field">
                <label for="date_end">Дата окончания</label>
                <input class="input" type="date" id="date_end" name="date_end" required>
            </div>
            <div class="field">
                <label for="price">Цена, ₽ (только цифры)</label>
                <input class="input" type="number" min="0" name="price" id="price" required>
            </div>
            <div class="field">
                <label for="trip_plan">План поездки</label>
                <textarea class="textarea" name="trip_plan" id="trip_plan" placeholder="Что планируете посмотреть?"></textarea>
            </div>
            <div class="field">
                <label for="file">Билет (PDF)</label>
                <input class="input" id="file" name="file" type="file" accept="application/pdf" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Создать</button>
        </form>
    </div>
</div>
{% endblock %}
